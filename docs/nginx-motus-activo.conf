client_max_body_size 20M;
server_tokens off;

################################
# HTTP (80) — Cloudflare Flexible llega aquí
# NO redirigir a HTTPS
################################
server {
    listen 80;
    server_name motus.automarket.com.pa;
    client_max_body_size 20M;

    location ~ /\.(env|git|svn) {
        deny all;
        return 404;
    }
    location ~* ^/(database|logs|backup|backups)(/|$) {
        deny all;
        return 404;
    }
    location ~* \.(sql|log|bak|old|pem|key)$ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Visitor $http_cf_visitor;
        proxy_request_buffering off;
        client_max_body_size 20M;
    }

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location /phpmyadmin/ {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.phpmyadmin;

        proxy_pass http://127.0.0.1:8089/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

################################
# HTTPS (443) — acceso directo al servidor (sin Cloudflare)
################################
server {
    listen 443 ssl;
    server_name motus.automarket.com.pa;
    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/motus.automarket.com.pa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motus.automarket.com.pa/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ /\.(env|git|svn) {
        deny all;
        return 404;
    }
    location ~* ^/(database|logs|backup|backups)(/|$) {
        deny all;
        return 404;
    }
    location ~* \.(sql|log|bak|old|pem|key)$ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        client_max_body_size 20M;
    }

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location /phpmyadmin/ {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.phpmyadmin;

        proxy_pass http://127.0.0.1:8089/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
